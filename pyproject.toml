[project]
name = "generalsmodbuilder"
description = "Mod Builder for Generals: Zero Hour"
authors = [{ name = "TheSuperHackers" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "beeprint>=2.4.10",
    "certifi>=2024.2.2",
    "markdownmaker>=0.4.0",
    "platformdirs>=4.2.0",
    "psd-tools>=1.10.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/TheSuperHackers/GeneralsModBuilder"

[project.scripts]
generalsmodbuilder = "generalsmodbuilder.main:Main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "generalsmodbuilder/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["generalsmodbuilder"]
